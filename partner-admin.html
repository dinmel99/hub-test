<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ED e M · Модерация партнёров</title><style>body{margin:0;background:#f5f6f8;color:#1b2735;font:15px system-ui,Arial}header{background:#151a22;color:#fff;padding:20px}header b{font:32px Georgia}em{color:#ff8001}main{max-width:1100px;margin:30px auto;padding:0 20px}.card{background:#fff;border:1px solid #e3e7ed;border-radius:16px;padding:20px;margin:15px 0}button{border:0;border-radius:8px;background:#ff8001;color:white;padding:10px 15px;cursor:pointer;font-weight:600}button.secondary{background:#eef0f4;color:#253143}input,select,textarea{font:inherit;border:1px solid #ccd4df;padding:10px;border-radius:8px;max-width:100%}select{width:300px}textarea{width:100%;min-height:75px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.row>*{flex:1}.muted{color:#657485}.alert{background:#fff0e3;padding:14px;border-radius:10px}.photos{display:flex;gap:8px;flex-wrap:wrap}.photos img{height:120px;max-width:200px;object-fit:cover;border-radius:8px}h1{font-size:26px}h2{font-size:20px}.hidden{display:none}a{color:#017ab3}
.member-item{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px;border:1px solid #e3e7ed;border-radius:12px;margin:10px 0}
.member-title{font-size:16px;font-weight:700}
.member-subtitle{font-size:13px;color:#657485;margin-top:5px}
.status{display:inline-block;font-size:12px;font-weight:700;border-radius:20px;padding:5px 9px;margin-left:8px}
.status-active{background:#e5f6eb;color:#176b39}
.status-revoked{background:#eef0f4;color:#586474}
.count{font-size:13px;font-weight:500;color:#657485}
details summary{cursor:pointer;font-weight:700;font-size:17px;padding:6px 0}
.member-item button{flex-shrink:0}
@media(max-width:600px){.member-item{align-items:flex-start;flex-direction:column}.member-item button{width:100%}}
</style></head><body><header><b>ED <em>e</em> M</b> &nbsp; | &nbsp; МОДЕРАЦИЯ ПАРТНЁРОВ</header><main><p><a href="./">← Вернуться в HUB</a></p><div id="notice" class="alert">Проверяем права администратора…</div><div id="content" class="hidden"><h1>Партнёрские заявки</h1><section class="card"><h2>Новые партнёры</h2><div id="requests"></div></section><section class="card"><h2>Проекты на модерации</h2><div id="projects"></div></section><section class="card"><h2>Действующие партнёры <span id="activeCount" class="count"></span></h2><div id="members"></div></section>
<section class="card"><details id="archive"><summary>Архив доступов <span id="archivedCount" class="count"></span></summary><p class="muted">Отозванные доступы сохраняются для истории. Их можно восстановить.</p><div id="archivedMembers"></div></details></section><p><button id="reload" class="secondary">Обновить данные</button></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
(()=>{'use strict';const db=window.supabase.createClient('https://vnkxhmvjsgaogxwpwgla.supabase.co','sb_publishable_pHSDyJPe_fR83Jk6_c82JQ_J2o-rhhZ');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let contractors=[],members=[],requests=[],projects=[];const note=s=>$('notice').textContent=s;function fail(e){throw Error(e?.message||String(e))}async function load(){try{const {data:{user}}=await db.auth.getUser();if(!user){note('Сначала войдите под администратором на основном сайте HUB.');return}const {data:admin,error:ae}=await db.rpc('is_hub_admin');if(ae)fail(ae);if(!admin){note('Доступ только для администратора.');return}$('content').classList.remove('hidden');const [c,m,r,p]=await Promise.all([db.from('hub_contractors').select('id,name').order('name'),db.from('hub_partner_members').select('*'),db.from('hub_partner_requests').select('*').order('created_at',{ascending:false}),db.from('hub_partner_submissions').select('*').order('created_at',{ascending:false})]);for(const x of [c,m,r,p])if(x.error)fail(x.error);contractors=c.data||[];members=m.data||[];requests=r.data||[];projects=p.data||[];const opts=contractors.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');$('requests').innerHTML=requests.filter(x=>x.status==='pending').map(x=>`<article class="card"><b>${esc(x.company_name)}</b><p>${esc(x.contact_name)} · ${esc(x.phone)}</p><p class="muted">Пользователь: ${esc(x.user_id)}</p><div class="row"><select data-company="${x.user_id}">${opts}</select><button data-approve="${x.user_id}">Одобрить</button><button class="secondary" data-reject="${x.user_id}">Отклонить</button></div></article>`).join('')||'<p class="muted">Нет новых заявок.</p>';
$('projects').innerHTML=projects.filter(x=>x.status==='review').map(x=>`<article class="card"><h3>${esc(x.name)} ${x.revision_of_project_id?'<span style="font-size:12px;background:#e7f2fc;color:#017ab3;padding:5px 8px;border-radius:8px">Обновление существующего проекта</span>':'<span style="font-size:12px;background:#fff1e6;padding:5px 8px;border-radius:8px">Новый проект</span>'}</h3><p class="muted">${esc(contractors.find(c=>c.id===x.contractor_id)?.name||'Подрядчик')} · ${esc(x.area||'—')} м² · ${esc(x.technology||'—')}</p><p>${esc(x.description||'')}</p><p>Тёплый контур: ${esc(x.price_warm_min??'—')} · White box: ${esc(x.price_white_min??'—')} · Под ключ: ${esc(x.price_turnkey_min??'—')} тыс. ₽/м²</p><div class="photos" id="photos-${x.id}">Загружаем фото…</div><p><textarea data-note="${x.id}" placeholder="Комментарий модератора"></textarea></p><button data-publish="${x.id}">Опубликовать</button> <button class="secondary" data-revision="${x.id}">На доработку</button> <button class="secondary" data-decline="${x.id}">Отклонить</button></article>`).join('')||'<p class="muted">Нет проектов на проверке.</p>';
const latestRequestByUser=new Map();
for(const r of requests){
  if(!latestRequestByUser.has(r.user_id))latestRequestByUser.set(r.user_id,r);
}
const memberCard=x=>{
  const company=contractors.find(c=>c.id===x.contractor_id)?.name||'Компания не указана';
  const contact=latestRequestByUser.get(x.user_id)?.contact_name?.trim()||'Имя сотрудника не указано';
  const active=x.status==='active';
  return `<article class="member-item">
    <div>
      <div class="member-title">${esc(company)} <span class="status ${active?'status-active':'status-revoked'}">${active?'Активен':'Доступ отозван'}</span></div>
      <div class="member-subtitle">${esc(contact)} · ${esc(x.role==='employee'?'Сотрудник':x.role||'Роль не указана')}</div>
    </div>
    <button class="secondary" data-toggle="${esc(x.user_id)}" data-companyid="${esc(x.contractor_id)}" data-active="${!active}">${active?'Отозвать доступ':'Восстановить доступ'}</button>
  </article>`;
};
const activeMembers=members.filter(x=>x.status==='active');
const archivedMembers=members.filter(x=>x.status!=='active');
$('activeCount').textContent=`(${activeMembers.length})`;
$('archivedCount').textContent=`(${archivedMembers.length})`;
$('members').innerHTML=activeMembers.map(memberCard).join('')||'<p class="muted">Нет действующих партнёров.</p>';
$('archivedMembers').innerHTML=archivedMembers.map(memberCard).join('')||'<p class="muted">Архив пуст.</p>';for(const p of projects.filter(x=>x.status==='review')){const {data,error}=await db.from('hub_partner_submission_images').select('storage_path,kind').eq('submission_id',p.id).order('sort_order');const el=$('photos-'+p.id);if(!el)continue;el.innerHTML=error?'Ошибка: '+esc(error.message):(data||[]).map(i=>`<a target="_blank" rel="noopener" href="${esc(db.storage.from('house-images').getPublicUrl(i.storage_path).data.publicUrl)}"><img alt="${esc(i.kind)}" src="${esc(db.storage.from('house-images').getPublicUrl(i.storage_path).data.publicUrl)}"></a>`).join('')||'Нет фотографий'}note('Данные обновлены. Новые проекты публикуются в каталоге; обновления изменяют существующий проект без дубля.');}catch(e){note('Ошибка: '+e.message)}}
$('content').onclick=async e=>{const b=e.target.closest('button[data-approve],button[data-reject],button[data-publish],button[data-revision],button[data-decline],button[data-toggle]');if(!b)return;b.disabled=true;try{if(b.dataset.approve){const id=b.dataset.approve;const contractorId=document.querySelector(`[data-company="${id}"]`).value;const {error}=await db.rpc('hub_partner_request_review',{p_user_id:id,p_contractor_id:contractorId,p_approve:true});if(error)fail(error)}else if(b.dataset.reject){const {error}=await db.rpc('hub_partner_request_review',{p_user_id:b.dataset.reject,p_contractor_id:null,p_approve:false});if(error)fail(error)}else if(b.dataset.toggle){if(b.dataset.active==='false'&&!confirm('Отозвать партнёрский доступ?'))return;const {error}=await db.rpc('hub_partner_assign',{p_user_id:b.dataset.toggle,p_contractor_id:b.dataset.companyid,p_active:b.dataset.active==='true'});if(error)fail(error)}else{const id=b.dataset.publish||b.dataset.revision||b.dataset.decline;const action=b.dataset.publish?'publish':b.dataset.revision?'revision':'rejected';const noteText=document.querySelector(`[data-note="${id}"]`).value;if(action==='publish'&&!confirm(projects.find(p=>p.id===id)?.revision_of_project_id?'Применить изменения к существующему проекту?':'Опубликовать новый проект в общем каталоге?'))return;const {error}=await db.rpc('hub_partner_review',{p_id:id,p_action:action,p_note:noteText});if(error)fail(error)}const archiveWasOpen=$('archive').open;await load();$('archive').open=archiveWasOpen}catch(err){note('Ошибка: '+err.message)}finally{b.disabled=false}};$('reload').onclick=load;load();})();
</script></body></html>
